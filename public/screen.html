<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maxischermo</title>
    <style>
        html, body { height: 100%; margin:0; }
        body { background: #000; display:flex; align-items:center; justify-content:center; }
        img { max-width: 100vw; max-height: 100vh; object-fit: contain; display:block; }
        .corner { position: fixed; top: 8px; left: 12px; color: #0ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; opacity:.8; }
    </style>
</head>
<body>
    <div class="corner">Maxischermo</div>
    <img id="screen" alt="schermo" />
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const img = document.getElementById('screen');
        socket.on('screen:show', ({ code, imageData }) => {
            img.src = imageData;
        });
    </script>
</body>
</html>
